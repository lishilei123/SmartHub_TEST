openapi: 3.1.0
info:
  title: MiniTask Expected API Contract
  version: 1.0.0
  description: |
    MiniTask 的正式预期 API 契约，用于 SmartHub 测试设计与 API 自动执行。
    本文件描述“应该如何工作”，不从当前 FastAPI 运行时 OpenAPI 反向生成。
    若运行时 /docs 与本文件冲突，以 docs/requirements.md 与本文件为测试预期依据。
servers:
  - url: http://localhost:8000
    description: Local Docker Compose backend

tags:
  - name: System
  - name: Auth
  - name: Projects
  - name: Tasks
  - name: Dashboard

paths:
  /api/health:
    get:
      tags: [System]
      summary: Health check
      operationId: health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/login:
    post:
      tags: [Auth]
      summary: Login
      operationId: login
      description: 使用演示账号 admin / admin123 登录。账号或密码错误必须返回 401，不能返回 token。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid username or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects:
    get:
      tags: [Projects]
      summary: List projects
      operationId: listProjects
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Projects]
      summary: Create project
      operationId: createProject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/projects/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    put:
      tags: [Projects]
      summary: Update project
      operationId: updateProject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
    delete:
      tags: [Projects]
      summary: Delete project
      operationId: deleteProject
      description: 删除项目时必须同步删除该项目下的全部任务。UI 二次确认属于前端交互要求，见 requirements.md。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Project and its tasks were deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProjectNotFound'

  /api/tasks:
    get:
      tags: [Tasks]
      summary: List and filter tasks
      operationId: listTasks
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: status
          in: query
          required: false
          description: 非法枚举值必须返回 400。
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - name: priority
          in: query
          required: false
          description: 非法枚举值必须返回 400。
          schema:
            $ref: '#/components/schemas/TaskPriority'
        - name: keyword
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Matching tasks. Every supplied filter must be applied accurately.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Tasks]
      summary: Create task
      operationId: createTask
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProjectNotFound'

  /api/tasks/{task_id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      summary: Get task
      operationId: getTask
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Task detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TaskNotFound'
    put:
      tags: [Tasks]
      summary: Update task fields
      operationId: updateTask
      description: 修改标题、描述或优先级。状态流转使用 PATCH /api/tasks/{task_id}/status。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TaskNotFound'
    delete:
      tags: [Tasks]
      summary: Delete task
      operationId: deleteTask
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Task deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TaskNotFound'

  /api/tasks/{task_id}/status:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    patch:
      tags: [Tasks]
      summary: Advance task status
      operationId: changeTaskStatus
      description: |
        状态只能按 todo -> in_progress -> completed 单向推进。
        不允许跳级、不允许回退；completed 为终态。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusUpdate'
      responses:
        '200':
          description: Status changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Invalid status value or invalid state transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TaskNotFound'

  /api/dashboard:
    get:
      tags: [Dashboard]
      summary: Get dashboard statistics
      operationId: getDashboard
      description: 统计必须与当前持久化项目和任务数据一致；unfinished = tasks - completed。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 使用 /api/login 返回的 token。

  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  responses:
    BadRequest:
      description: Invalid request data, enum value, boundary value, or business rule
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid Bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProjectNotFound:
      description: Project does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TaskNotFound:
      description: Task does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: minitask

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          example: admin
        password:
          type: string
          minLength: 1
          example: admin123

    LoginResponse:
      type: object
      required: [token, username]
      properties:
        token:
          type: string
          minLength: 1
        username:
          type: string
          const: admin

    ProjectCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '.*\S.*'
          description: 去除首尾空白后必须至少包含一个非空白字符。
        description:
          type: string
          default: ''

    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '.*\S.*'
          description: 传入时，去除首尾空白后必须至少包含一个非空白字符。
        description:
          type: string

    Project:
      allOf:
        - $ref: '#/components/schemas/ProjectCreate'
        - type: object
          required: [id, created_at, description]
          properties:
            id:
              type: integer
              minimum: 1
            created_at:
              type: string
              format: date-time

    TaskStatus:
      type: string
      enum: [todo, in_progress, completed]

    TaskPriority:
      type: string
      enum: [high, medium, low]

    TaskCreate:
      type: object
      required: [project_id, title]
      properties:
        project_id:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '.*\S.*'
          description: UI 与 API 使用相同边界；仅空白标题无效。
        description:
          type: string
          default: ''
        status:
          allOf:
            - $ref: '#/components/schemas/TaskStatus'
          default: todo
        priority:
          allOf:
            - $ref: '#/components/schemas/TaskPriority'
          default: medium

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '.*\S.*'
          description: 传入时不能为空或仅空白。
        description:
          type: string
        priority:
          $ref: '#/components/schemas/TaskPriority'

    StatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/TaskStatus'

    Task:
      type: object
      required: [id, project_id, title, description, status, priority, created_at, updated_at]
      properties:
        id:
          type: integer
          minimum: 1
        project_id:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 50
        description:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DashboardResponse:
      type: object
      required: [projects, tasks, completed, unfinished]
      properties:
        projects:
          type: integer
          minimum: 0
        tasks:
          type: integer
          minimum: 0
        completed:
          type: integer
          minimum: 0
        unfinished:
          type: integer
          minimum: 0

    DeleteResponse:
      type: object
      required: [deleted, id]
      properties:
        deleted:
          type: boolean
          const: true
        id:
          type: integer
          minimum: 1

    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          description: Error detail returned by the API
